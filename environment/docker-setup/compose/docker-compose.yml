# ============================================================
# Base compose — shared definitions for all environments.
# Do not use this file directly; use the env-specific overrides:
#
#   Dev : docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up
# ============================================================

services:

  # ----------------------------------------------------------
  # Spring Boot application
  # ----------------------------------------------------------
  app:
    build:
      context: ${REPO_ROOT:-.}
      dockerfile: environment/docker-setup/backend/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  # ----------------------------------------------------------
  # PostgreSQL
  # ----------------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ----------------------------------------------------------
  # Nginx — prod only. Assigned the "prod" profile so it never
  # starts automatically in dev (profiles must be explicitly
  # activated or the service is ignored entirely).
  # ----------------------------------------------------------
  nginx:
    profiles:
      - prod
    build:
      context: ${REPO_ROOT:-.}
      dockerfile: environment/docker-setup/nginx/Dockerfile
    depends_on:
      - app
    networks:
      - frontend
      - backend

volumes:
  db_data:

networks:
  frontend:
  backend: