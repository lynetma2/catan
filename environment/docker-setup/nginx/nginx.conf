# ============================================================
# Prod nginx config — HTTPS via Let's Encrypt / Certbot
#
# Before starting:
#   1. Point your DNS A record at this server
#   2. Run Certbot once to issue the cert:
#        docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm certbot \
#          certonly --webroot --webroot-path=/var/www/certbot \
#          -d yourdomain.com -d www.yourdomain.com \
#          --email you@yourdomain.com --agree-tos --no-eff-email
#   3. Uncomment the HTTPS server block below
#   4. Restart nginx
# ============================================================

# Redirect all HTTP → HTTPS
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Certbot webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

