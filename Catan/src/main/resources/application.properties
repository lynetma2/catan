spring.application.name=Hexa
management.endpoints.web.exposure.include=*
management.info.env.enabled=true
game-snapshot.base-path=src/main/resources/snapshot/game
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/hexa
spring.datasource.username=hexa
spring.datasource.password=hexa
# Flyway owns the schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Hibernate checks the schema, never changes it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false