spring.application.name=Hexa
management.endpoints.web.exposure.include=*
management.info.env.enabled=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/hexa
spring.datasource.username=hexa
spring.datasource.password=hexa

# Flyway owns the schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Keep this so local logs also have trace IDs for easier debugging
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]