services:
  backend:
    image: catan-backend:latest
    build: ./Catan
    restart: always
    volumes:
      - sqlite_data:/data
    environment:
      - SQLITE_URL=jdbc:sqlite:/data/catan_games.db

  frontend:
    image: catan-frontend:latest
    build: ./frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  sqlite_data:
    name: catan_sqlite_data