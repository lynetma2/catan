services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: hexa
      POSTGRES_USER: hexa
      POSTGRES_PASSWORD: hexa
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexa -d hexa"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: catan-backend:latest
    build: ./Catan
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hexa
      SPRING_DATASOURCE_USERNAME: hexa
      SPRING_DATASOURCE_PASSWORD: hexa
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: catan-frontend:latest
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    environment:
      BACKEND_URL: backend:8080
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pg_data:
    name: catan_pg_data
  caddy_data:
    name: catan_caddy_data
  caddy_config:
    name: catan_caddy_config


