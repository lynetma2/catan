services:
  backend:
    image: catan-backend:latest
    build: ./Catan
    restart: always
    volumes:
      - sqlite_data:/data
    environment:
      - SQLITE_URL=jdbc:sqlite:/data/catan_games.db

  frontend:
    image: catan-frontend:latest
    build: ./frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"     # <--- Added for HTTPS
    environment:
      - DOMAIN=hexa.sundtrack.com  # <--- PUT YOUR ACTUAL DOMAIN HERE
    volumes:
      - caddy_data:/data       # <--- Stores the Let's Encrypt Certs
      - caddy_config:/config   # <--- Stores Caddy's internal state
    depends_on:
      - backend

volumes:
  sqlite_data:
    name: catan_sqlite_data
  caddy_data:
    name: catan_caddy_data
  caddy_config:
    name: catan_caddy_config