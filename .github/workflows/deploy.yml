name: Build and Deploy to VPS

on:
  workflow_dispatch:   # <-- the literal "Run workflow" button in the Actions tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./Catan
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/catan-backend:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/catan-frontend:latest

      # PRIVATE-QUOTA GUARD: keep only the newest versions so you stay under 500 MB
      - name: Clean up old backend versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: catan-backend
          package-type: container
          min-versions-to-keep: 2
      - name: Clean up old frontend versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: catan-frontend
          package-type: container
          min-versions-to-keep: 2

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u lynetma2 --password-stdin
            cd /opt/catan-game
            docker compose pull
            docker compose up -d
            docker image prune -f